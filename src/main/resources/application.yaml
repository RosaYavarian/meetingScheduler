spring:
  application:
    name: meetingScheduler

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/meetingScheduler}
    username: ${DB_USERNAME:scheduler}
    password: ${DB_PASSWORD:scheduler}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
